name: Windows build and tests
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -A x64
      - name: Build
        run: cmake --build build --config Release
      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure
      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist/package | Out-Null
          Copy-Item build/Release/ScreenRelay.exe,portable.flag,README.md,README.ru.md,LICENSE,vendor/JSON-LICENSE -Destination dist/package
          Copy-Item AGENTS.md -Destination dist/package
          Copy-Item docs -Destination dist/package -Recurse
          Compress-Archive -Path dist/package/* -DestinationPath dist/ScreenRelay-windows-x64.zip
          $hash = (Get-FileHash dist/ScreenRelay-windows-x64.zip -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  ScreenRelay-windows-x64.zip" | Set-Content dist/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: ScreenRelay-windows-x64
          path: |
            dist/ScreenRelay-windows-x64.zip
            dist/SHA256SUMS.txt
